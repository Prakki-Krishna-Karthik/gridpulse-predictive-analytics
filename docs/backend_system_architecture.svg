<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">GridPulse backend system architecture</title>
  <desc id="desc">System-design diagram showing CSV inputs, preprocessing, processed artifacts, research models, backend API services, and the browser dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fafc"/><stop offset="1" stop-color="#eef4f7"/></linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f4ff"/><stop offset="1" stop-color="#d6eaff"/></linearGradient>
    <linearGradient id="service" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2df"/><stop offset="1" stop-color="#ffe2bc"/></linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eeeaff"/><stop offset="1" stop-color="#ded6ff"/></linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f8ef"/><stop offset="1" stop-color="#cff0dc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#8ba0ad" flood-opacity=".2"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55717f"/></marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c7da0"/></marker>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#173b56">GridPulse Backend System Architecture</text>
  <text x="70" y="105" font-family="Arial, sans-serif" font-size="16" fill="#587080">Predictive forecasting + graph intelligence + prescriptive route screening</text>

  <g font-family="Arial, sans-serif" fill="#173b56">
    <text x="70" y="155" font-size="14" font-weight="700" letter-spacing="1.5">1 · INPUT DATA</text>
    <rect x="70" y="180" width="240" height="120" rx="16" fill="url(#data)" stroke="#70a9c4" stroke-width="2" filter="url(#shadow)"/>
    <text x="95" y="218" font-size="20" font-weight="700">dynamic_with_flows.csv</text>
    <text x="95" y="247" font-size="14" fill="#587080">country load, renewable,</text>
    <text x="95" y="270" font-size="14" fill="#587080">net flow and coordinates</text>
    <rect x="70" y="330" width="240" height="120" rx="16" fill="url(#data)" stroke="#70a9c4" stroke-width="2" filter="url(#shadow)"/>
    <text x="95" y="368" font-size="20" font-weight="700">power_flow.csv</text>
    <text x="95" y="397" font-size="14" fill="#587080">directional interconnector</text>
    <text x="95" y="420" font-size="14" fill="#587080">records and timestamps</text>

    <text x="390" y="155" font-size="14" font-weight="700" letter-spacing="1.5">2 · ETL AND GRAPH BUILDING</text>
    <rect x="390" y="210" width="330" height="250" rx="18" fill="#ffffff" stroke="#6c9eb5" stroke-width="2" filter="url(#shadow)"/>
    <text x="420" y="250" font-size="22" font-weight="700">backend/pipeline.py</text>
    <text x="420" y="285" font-size="15" fill="#415d6b">• validate and clean records</text>
    <text x="420" y="314" font-size="15" fill="#415d6b">• canonicalize 24 links</text>
    <text x="420" y="343" font-size="15" fill="#415d6b">• build 12 country nodes</text>
    <text x="420" y="372" font-size="15" fill="#415d6b">• derive features and centrality</text>
    <text x="420" y="401" font-size="15" fill="#415d6b">• calculate risk and loss proxy</text>
    <text x="420" y="430" font-size="15" fill="#415d6b">• create chronological history</text>

    <text x="795" y="155" font-size="14" font-weight="700" letter-spacing="1.5">3 · PROCESSED STORAGE</text>
    <rect x="795" y="210" width="270" height="250" rx="18" fill="url(#data)" stroke="#70a9c4" stroke-width="2" filter="url(#shadow)"/>
    <text x="825" y="250" font-size="22" font-weight="700">data/processed/</text>
    <text x="825" y="290" font-size="15" fill="#415d6b">manifest.json</text>
    <text x="825" y="320" font-size="15" fill="#415d6b">series.json</text>
    <text x="825" y="350" font-size="15" fill="#415d6b">snapshot.json</text>
    <text x="825" y="380" font-size="15" fill="#415d6b">model_metrics.json</text>
    <text x="825" y="420" font-size="14" fill="#587080">compact artifacts for replay</text>

    <text x="1140" y="155" font-size="14" font-weight="700" letter-spacing="1.5">4 · RESEARCH LAYER</text>
    <rect x="1140" y="190" width="390" height="280" rx="18" fill="url(#model)" stroke="#8d7ad0" stroke-width="2" filter="url(#shadow)"/>
    <text x="1170" y="230" font-size="22" font-weight="700">backend/experiments.py</text>
    <rect x="1170" y="255" width="150" height="70" rx="10" fill="#ffffff" stroke="#9e8de0"/>
    <text x="1245" y="285" text-anchor="middle" font-size="16" font-weight="700">Fusion GRU</text>
    <text x="1245" y="306" text-anchor="middle" font-size="12" fill="#587080">temporal baseline</text>
    <rect x="1350" y="255" width="150" height="70" rx="10" fill="#ffffff" stroke="#9e8de0"/>
    <text x="1425" y="285" text-anchor="middle" font-size="16" font-weight="700">DCRNN</text>
    <text x="1425" y="306" text-anchor="middle" font-size="12" fill="#587080">graph diffusion model</text>
    <text x="1170" y="360" font-size="15" fill="#415d6b">• 24-hour windows and chronological split</text>
    <text x="1170" y="389" font-size="15" fill="#415d6b">• RMSE, MAE, F1, ROC/PR and confusion matrix</text>
    <text x="1170" y="418" font-size="15" fill="#415d6b">• feature importance, t-SNE and error analysis</text>
    <text x="1170" y="447" font-size="15" fill="#415d6b">• results/*.json and results/figures/*.png</text>

    <path d="M310 240 L390 270" stroke="#55717f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M310 390 L390 400" stroke="#55717f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M720 335 L795 335" stroke="#55717f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M1065 335 L1140 335" stroke="#55717f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

    <text x="70" y="535" font-size="14" font-weight="700" letter-spacing="1.5">5 · RUNTIME BACKEND SERVICE</text>
    <rect x="70" y="570" width="1460" height="250" rx="20" fill="#fffdf9" stroke="#d89145" stroke-width="2" filter="url(#shadow)"/>
    <text x="105" y="614" font-size="24" font-weight="700">backend/server.py — ThreadingHTTPServer on localhost:8000</text>
    <rect x="105" y="650" width="260" height="125" rx="12" fill="url(#service)" stroke="#dc9b52"/>
    <text x="235" y="685" text-anchor="middle" font-size="17" font-weight="700">Snapshot engine</text>
    <text x="235" y="713" text-anchor="middle" font-size="13" fill="#6d5b47">snapshot_at()</text>
    <text x="235" y="738" text-anchor="middle" font-size="13" fill="#6d5b47">risk + utilization</text>
    <rect x="395" y="650" width="260" height="125" rx="12" fill="url(#service)" stroke="#dc9b52"/>
    <text x="525" y="685" text-anchor="middle" font-size="17" font-weight="700">Forecast service</text>
    <text x="525" y="713" text-anchor="middle" font-size="13" fill="#6d5b47">/api/forecast</text>
    <text x="525" y="738" text-anchor="middle" font-size="13" fill="#6d5b47">next-hour flow</text>
    <rect x="685" y="650" width="260" height="125" rx="12" fill="url(#service)" stroke="#dc9b52"/>
    <text x="815" y="685" text-anchor="middle" font-size="17" font-weight="700">Graph intelligence</text>
    <text x="815" y="713" text-anchor="middle" font-size="13" fill="#6d5b47">graph_analysis.py</text>
    <text x="815" y="738" text-anchor="middle" font-size="13" fill="#6d5b47">stress + resilience</text>
    <rect x="975" y="650" width="240" height="125" rx="12" fill="url(#service)" stroke="#dc9b52"/>
    <text x="1095" y="685" text-anchor="middle" font-size="17" font-weight="700">Physics proxy</text>
    <text x="1095" y="713" text-anchor="middle" font-size="13" fill="#6d5b47">physics.py</text>
    <text x="1095" y="738" text-anchor="middle" font-size="13" fill="#6d5b47">distance + loss</text>
    <rect x="1245" y="650" width="240" height="125" rx="12" fill="url(#service)" stroke="#dc9b52"/>
    <text x="1365" y="685" text-anchor="middle" font-size="17" font-weight="700">Route planner</text>
    <text x="1365" y="713" text-anchor="middle" font-size="13" fill="#6d5b47">routing.py</text>
    <text x="1365" y="738" text-anchor="middle" font-size="13" fill="#6d5b47">what-if rerouting</text>

    <path d="M930 460 L930 570" stroke="#2c7da0" stroke-width="3" fill="none" marker-end="url(#blueArrow)"/>
    <text x="950" y="525" font-size="13" fill="#2c7da0">loads artifacts</text>

    <text x="70" y="880" font-size="14" font-weight="700" letter-spacing="1.5">6 · API AND PRESENTATION CONSUMERS</text>
    <rect x="70" y="905" width="620" height="65" rx="14" fill="#ffffff" stroke="#6c9eb5" stroke-width="2"/>
    <text x="380" y="933" text-anchor="middle" font-size="16" font-weight="700">REST JSON: metadata · snapshot · forecast · route-plan · what-if</text>
    <text x="380" y="955" text-anchor="middle" font-size="13" fill="#587080">GET /api/* and POST /api/what-if</text>
    <rect x="910" y="905" width="620" height="65" rx="14" fill="url(#client)" stroke="#5aa379" stroke-width="2"/>
    <text x="1220" y="933" text-anchor="middle" font-size="17" font-weight="700">frontend/index.html + app.js</text>
    <text x="1220" y="955" text-anchor="middle" font-size="13" fill="#416c52">SVG topology · charts · alerts · rerouting animation</text>
    <path d="M690 937 L910 937" stroke="#55717f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M800 820 L800 905" stroke="#55717f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="820" y="865" font-size="13" fill="#55717f">REST + SSE stream</text>
  </g>

  <text x="70" y="995" font-family="Arial, sans-serif" font-size="12" fill="#718895">Note: the dashboard replays historical processed timestamps; it is not connected to live utility telemetry.</text>
</svg>
