<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">GridPulse end to end workflow architecture</title>
  <desc id="desc">Flowchart from raw power-grid CSV data through cleaning, feature extraction, forecasting, evaluation, graph reasoning, scenario simulation, rerouting and final recommendation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbfd"/><stop offset="1" stop-color="#edf4f7"/></linearGradient>
    <linearGradient id="source" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3f2ff"/><stop offset="1" stop-color="#cde6fa"/></linearGradient>
    <linearGradient id="process" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#edf7fb"/></linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eeeaff"/><stop offset="1" stop-color="#dbd3ff"/></linearGradient>
    <linearGradient id="decision" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff4de"/><stop offset="1" stop-color="#ffe1ad"/></linearGradient>
    <linearGradient id="output" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f8ef"/><stop offset="1" stop-color="#cdeed9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#7d96a4" flood-opacity=".2"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58717e"/></marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7799"/></marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c57a28"/></marker>
  </defs>

  <rect width="1800" height="1120" fill="url(#background)"/>
  <text x="80" y="66" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#173b56">GridPulse End-to-End Predictive and Prescriptive Workflow</text>
  <text x="80" y="102" font-family="Arial, sans-serif" font-size="17" fill="#597582">Data → Cleaning → Features → Forecasting → Evaluation → Graph reasoning → Scenario simulation → Recommendation</text>

  <g font-family="Arial, sans-serif" fill="#173b56">
    <!-- Main analytical pipeline -->
    <text x="80" y="150" font-size="14" font-weight="700" letter-spacing="1.5">OFFLINE MODEL-BUILDING PIPELINE</text>

    <rect x="80" y="180" width="235" height="180" rx="18" fill="url(#source)" stroke="#62a4c7" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="116" cy="218" r="20" fill="#2d82a7"/><text x="116" y="225" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1</text>
    <text x="151" y="224" font-size="21" font-weight="700">Raw data</text>
    <text x="105" y="264" font-size="15" fill="#415d6b">dynamic_with_flows.csv</text>
    <text x="105" y="292" font-size="15" fill="#415d6b">power_flow.csv</text>
    <text x="105" y="328" font-size="14" fill="#587080">country signals, timestamps,</text>
    <text x="105" y="350" font-size="14" fill="#587080">directional interconnectors</text>

    <rect x="365" y="180" width="270" height="180" rx="18" fill="url(#process)" stroke="#6c9eb5" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="401" cy="218" r="20" fill="#2d82a7"/><text x="401" y="225" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
    <text x="436" y="224" font-size="21" font-weight="700">Clean and align</text>
    <text x="390" y="264" font-size="14" fill="#415d6b">schema + type validation</text>
    <text x="390" y="290" font-size="14" fill="#415d6b">missing / duplicate checks</text>
    <text x="390" y="316" font-size="14" fill="#415d6b">canonical edge aliases</text>
    <text x="390" y="342" font-size="14" fill="#415d6b">hourly timestamp alignment</text>

    <polygon points="760,180 880,270 760,360 640,270" fill="url(#decision)" stroke="#d99a4d" stroke-width="2" filter="url(#shadow)"/>
    <text x="760" y="257" text-anchor="middle" font-size="18" font-weight="700">Quality</text>
    <text x="760" y="282" text-anchor="middle" font-size="18" font-weight="700">acceptable?</text>
    <text x="660" y="415" font-size="13" fill="#c07824">NO → flag, correct and review</text>

    <rect x="900" y="180" width="280" height="180" rx="18" fill="url(#process)" stroke="#6c9eb5" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="936" cy="218" r="20" fill="#2d82a7"/><text x="936" y="225" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3</text>
    <text x="971" y="224" font-size="21" font-weight="700">Graph + features</text>
    <text x="925" y="264" font-size="14" fill="#415d6b">12 country nodes / 24 links</text>
    <text x="925" y="290" font-size="14" fill="#415d6b">net flow, load, imbalance</text>
    <text x="925" y="316" font-size="14" fill="#415d6b">centrality + coordinates</text>
    <text x="925" y="342" font-size="14" fill="#415d6b">distance-loss proxy</text>

    <rect x="1245" y="180" width="245" height="180" rx="18" fill="url(#process)" stroke="#6c9eb5" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="1281" cy="218" r="20" fill="#2d82a7"/><text x="1281" y="225" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">4</text>
    <text x="1316" y="224" font-size="21" font-weight="700">Time windows</text>
    <text x="1270" y="264" font-size="14" fill="#415d6b">24-hour lookback</text>
    <text x="1270" y="290" font-size="14" fill="#415d6b">train / validation / test</text>
    <text x="1270" y="316" font-size="14" fill="#415d6b">chronological split</text>
    <text x="1270" y="342" font-size="14" fill="#415d6b">no future leakage</text>

    <rect x="1555" y="180" width="180" height="180" rx="18" fill="url(#model)" stroke="#8d7ad0" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="1591" cy="218" r="20" fill="#7565bd"/><text x="1591" y="225" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">5</text>
    <text x="1626" y="224" font-size="21" font-weight="700">Forecast</text>
    <text x="1580" y="264" font-size="14" fill="#514a75">Persistence</text>
    <text x="1580" y="290" font-size="14" fill="#514a75">Fusion GRU</text>
    <text x="1580" y="316" font-size="14" fill="#514a75">DCRNN</text>
    <text x="1580" y="342" font-size="14" fill="#514a75">next-hour net flow</text>

    <path d="M315 270 L365 270" stroke="#58717e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M635 270 L640 270" stroke="#58717e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M880 270 L900 270" stroke="#58717e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M1180 270 L1245 270" stroke="#58717e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M1490 270 L1555 270" stroke="#58717e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M760 360 L760 392 L500 392 L500 360" stroke="#c57a28" stroke-width="3" stroke-dasharray="7 6" fill="none" marker-end="url(#orangeArrow)"/>

    <!-- Evaluation branch -->
    <path d="M1645 360 L1645 430 L1355 430" stroke="#7565bd" stroke-width="3" fill="none" marker-end="url(#blueArrow)"/>
    <text x="1660" y="405" font-size="13" fill="#7565bd">predictions</text>
    <rect x="1020" y="400" width="390" height="150" rx="18" fill="url(#model)" stroke="#8d7ad0" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="1056" cy="438" r="20" fill="#7565bd"/><text x="1056" y="445" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">6</text>
    <text x="1091" y="444" font-size="21" font-weight="700">Evaluate models</text>
    <text x="1045" y="482" font-size="14" fill="#514a75">RMSE · MAE · MAPE · Accuracy · F1</text>
    <text x="1045" y="508" font-size="14" fill="#514a75">ROC/PR · confusion matrix · t-SNE</text>
    <text x="1045" y="534" font-size="14" fill="#514a75">feature importance + error analysis</text>
    <path d="M1020 475 L900 475 L900 360" stroke="#7565bd" stroke-width="3" fill="none" marker-end="url(#blueArrow)"/>
    <text x="908" y="461" font-size="13" fill="#7565bd">compare and select</text>

    <!-- Runtime decision pipeline -->
    <text x="80" y="625" font-size="14" font-weight="700" letter-spacing="1.5">RUNTIME DECISION-SUPPORT PIPELINE</text>
    <rect x="80" y="660" width="260" height="185" rx="18" fill="url(#source)" stroke="#62a4c7" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="116" cy="698" r="20" fill="#2d82a7"/><text x="116" y="705" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">7</text>
    <text x="151" y="704" font-size="21" font-weight="700">Replay snapshot</text>
    <text x="105" y="744" font-size="14" fill="#415d6b">server.py loads one timestamp</text>
    <text x="105" y="770" font-size="14" fill="#415d6b">current node and edge state</text>
    <text x="105" y="796" font-size="14" fill="#415d6b">REST + SSE to dashboard</text>
    <text x="105" y="822" font-size="14" fill="#587080">historical replay, not telemetry</text>

    <rect x="395" y="660" width="300" height="185" rx="18" fill="url(#process)" stroke="#6c9eb5" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="431" cy="698" r="20" fill="#2d82a7"/><text x="431" y="705" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">8</text>
    <text x="466" y="704" font-size="21" font-weight="700">Graph reasoning</text>
    <text x="420" y="744" font-size="14" fill="#415d6b">node risk + centrality</text>
    <text x="420" y="770" font-size="14" fill="#415d6b">two-step stress propagation</text>
    <text x="420" y="796" font-size="14" fill="#415d6b">edge criticality + resilience</text>
    <text x="420" y="822" font-size="14" fill="#587080">identify where pressure spreads</text>

    <rect x="750" y="660" width="300" height="185" rx="18" fill="url(#decision)" stroke="#d99a4d" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="786" cy="698" r="20" fill="#c57a28"/><text x="786" y="705" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">9</text>
    <text x="821" y="704" font-size="21" font-weight="700">Scenario simulation</text>
    <text x="775" y="744" font-size="14" fill="#6d5b47">reduce stressed transfer</text>
    <text x="775" y="770" font-size="14" fill="#6d5b47">remove edge hypothetically</text>
    <text x="775" y="796" font-size="14" fill="#6d5b47">search alternate paths</text>
    <text x="775" y="822" font-size="14" fill="#6d5b47">check headroom and loss</text>

    <polygon points="1155,660 1305,752 1155,845 1005,752" fill="url(#decision)" stroke="#d99a4d" stroke-width="2" filter="url(#shadow)"/>
    <text x="1155" y="738" text-anchor="middle" font-size="18" font-weight="700">Route</text>
    <text x="1155" y="763" text-anchor="middle" font-size="18" font-weight="700">feasible?</text>
    <text x="1300" y="684" font-size="13" fill="#c07824">YES</text>
    <text x="1300" y="824" font-size="13" fill="#c07824">NO: best-effort</text>

    <rect x="1370" y="660" width="350" height="185" rx="18" fill="url(#output)" stroke="#55a274" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="1406" cy="698" r="20" fill="#3b9561"/><text x="1406" y="705" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">10</text>
    <text x="1441" y="704" font-size="21" font-weight="700">Recommendation</text>
    <text x="1395" y="744" font-size="14" fill="#416c52">candidate route and moved MW</text>
    <text x="1395" y="770" font-size="14" fill="#416c52">risk, utilization and loss delta</text>
    <text x="1395" y="796" font-size="14" fill="#416c52">animated route in the graph</text>
    <text x="1395" y="822" font-size="14" fill="#416c52">human engineering review required</text>

    <path d="M340 752 L395 752" stroke="#58717e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M695 752 L750 752" stroke="#58717e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M1050 752 L1055 752" stroke="#58717e" stroke-width="3" fill="none" marker-end="url(#orangeArrow)"/>
    <path d="M1305 752 L1370 752" stroke="#c57a28" stroke-width="3" fill="none" marker-end="url(#orangeArrow)"/>
    <path d="M1155 660 L1155 590 L900 590 L900 550" stroke="#c57a28" stroke-width="3" fill="none" marker-end="url(#orangeArrow)"/>
    <text x="1168" y="620" font-size="13" fill="#c07824">scenario result</text>

    <!-- Dashboard consumer -->
    <rect x="650" y="930" width="500" height="115" rx="18" fill="#ffffff" stroke="#5aa379" stroke-width="2" filter="url(#shadow)"/>
    <text x="900" y="970" text-anchor="middle" font-size="21" font-weight="700">Browser dashboard</text>
    <text x="900" y="998" text-anchor="middle" font-size="14" fill="#416c52">SVG network · live-looking charts · alerts · forecast · reroute overlay</text>
    <text x="900" y="1025" text-anchor="middle" font-size="14" fill="#587080">The final decision is displayed, explained and logged—not automatically executed.</text>
    <path d="M900 845 L900 930" stroke="#3b9561" stroke-width="3" fill="none" marker-end="url(#blueArrow)"/>
  </g>

  <text x="80" y="1090" font-family="Arial, sans-serif" font-size="13" fill="#718895">Core separation: prediction estimates what may happen; graph reasoning explains network pressure; prescriptive simulation tests what could be done.</text>
</svg>
